name: Build Windows App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install
      - name: Download skyseg model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "core/models"
          curl.exe -L "https://huggingface.co" -o "core/models/skyseg.onnx"
      - run: bun x tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: MeraRAW-Windows
          path: |
            src-tauri/target/release/*.exe
            !src-tauri/target/release/build/**
            core/models/skyseg.onnx
